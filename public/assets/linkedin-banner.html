<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1584px;
      height: 396px;
      background-color: #FAF9F5;
      color: #171717;
      font-family: 'Newsreader', Georgia, serif;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
    }

    /* Ambient atmospheric depth */
    .ambient-glow-amber {
      position: absolute;
      top: -140px;
      right: 220px;
      width: 620px;
      height: 520px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .ambient-glow-teal {
      position: absolute;
      bottom: -120px;
      right: -40px;
      width: 520px;
      height: 440px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.045) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Subtle histological arbor positioned behind the avatar area */
    .histology-watermark {
      position: absolute;
      left: 100px;
      top: 48%;
      transform: translateY(-50%);
      width: 280px;
      height: 280px;
      opacity: 0.065;
      color: #171717;
      pointer-events: none;
    }

    /* Frame container */
    .banner-frame {
      width: 1504px;
      height: 336px;
      margin: 0 auto;
      border: 1px solid rgba(229, 226, 218, 0.85);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 56px;
      background: rgba(250, 249, 245, 0.6);
    }

    /* Top Strip */
    .top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .seal-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .seal-svg {
      width: 24px;
      height: 24px;
      color: #171717;
    }

    .mono-coord {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #737373;
      font-weight: 500;
    }

    /* Main Content Area - Shifted safely right to clear LinkedIn avatar zone (left 0-380px) */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 360px;
    }

    .headline {
      font-size: 58px;
      font-weight: 350;
      line-height: 1.02;
      letter-spacing: -0.035em;
      color: #0A0A0A;
      max-width: 980px;
    }

    .sub-discipline {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 20px;
      font-weight: 400;
      color: #525252;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sub-dot {
      color: #D97706;
      font-size: 14px;
    }

    /* Bottom Strip */
    .bottom-strip {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-top: 1px solid rgba(229, 226, 218, 0.85);
      padding-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #737373;
    }

    .domain {
      color: #171717;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div class="ambient-glow-amber"></div>
  <div class="ambient-glow-teal"></div>

  <!-- Background histological watermark positioned in avatar area -->
  <svg class="histology-watermark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round">
    <path d="M16 2v10M16 12l-5 6h10l-5-6ZM11 18l-4 8M21 18l4 8M16 18v12M14 26h4" />
    <circle cx="16" cy="14" r="2" fill="currentColor" />
  </svg>

  <div class="banner-frame">
    <!-- Top Strip -->
    <div class="top-strip">
      <div class="seal-lockup">
        <svg class="seal-svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M16 2v10M16 12l-5 6h10l-5-6ZM11 18l-4 8M21 18l4 8M16 18v12M14 26h4" />
          <circle cx="16" cy="14" r="1.75" fill="#D97706" stroke="#D97706" />
        </svg>
        <span class="mono-coord">Meghan Lendhe</span>
      </div>
      <span class="mono-coord">Product Designer &amp; NeuroHCI Researcher</span>
    </div>

    <!-- Main Content Area: Clears profile avatar overlay -->
    <div class="content-area">
      <h1 class="headline">Designing for the era of neural interfaces.</h1>
      <div class="sub-discipline">
        <span>Product Design</span>
        <span class="sub-dot">·</span>
        <span>NeuroHCI &amp; Biosignals</span>
        <span class="sub-dot">·</span>
        <span>Complex Systems</span>
      </div>
    </div>

    <!-- Bottom Strip: Clean coordinates, right-aligned away from avatar -->
    <div class="bottom-strip">
      <span class="domain">meghan.in · Mumbai, India</span>
    </div>
  </div>
</body>

</html>
